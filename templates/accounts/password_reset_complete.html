{% extends "base.html" %}
{% block title %}Password changed{% endblock %}
{% block main_class %}d-flex align-items-center{% endblock %}
{% block content %}
<div class="auth-single mx-auto">
  <div class="card shadow-sm">
    <div class="card-body p-4 text-center">
      <h1 class="h4 card-title mb-2">Password changed</h1>
      <p class="text-secondary">You can now sign in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-brand w-100">Go to login</a>
    </div>
  </div>
</div>
{% endblock %}
